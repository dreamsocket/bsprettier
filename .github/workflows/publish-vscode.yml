name: publish-vscode

# Packages the extension VSIX for a given vscode-v* release tag, attaches it to
# that GitHub Release, and publishes it to Open VSX.
#
# Two ways in:
#   - workflow_call: invoked by release-please.yml right after it cuts a
#     vscode-v* release (automatic for every future extension release).
#   - workflow_dispatch: run manually for a specific tag (e.g. to publish the
#     existing vscode-v0.2.0, or to re-publish).

on:
  workflow_call:
    inputs:
      tag:
        description: "vscode release tag to publish (e.g. vscode-v0.2.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "vscode release tag to publish (e.g. vscode-v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Package, attach, and publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npm run package:vscode

      - name: Resolve VSIX path
        id: vsix
        # Derive the exact filename from the packaged version so a stale or extra
        # .vsix can't make this ambiguous.
        run: |
          version="$(node -p "require('./packages/vscode-extension/package.json').version")"
          path="packages/vscode-extension/bsprettier-vscode-${version}.vsix"
          test -f "$path" || { echo "VSIX not found at $path"; ls -la packages/vscode-extension/*.vsix || true; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Attach VSIX to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" "${{ steps.vsix.outputs.path }}" --clobber

      - name: Ensure Open VSX namespace exists
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        # Idempotent: succeeds whether or not the namespace already exists.
        run: npx --yes ovsx create-namespace dreamsocket -p "$OVSX_TOKEN" || echo "namespace already exists; continuing"

      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: npx --yes ovsx publish "${{ steps.vsix.outputs.path }}" -p "$OVSX_TOKEN"
