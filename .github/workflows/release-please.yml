name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      cli_released: ${{ steps.release.outputs['packages/cli--release_created'] }}
      cli_tag: ${{ steps.release.outputs['packages/cli--tag_name'] }}
      vscode_released: ${{ steps.release.outputs['packages/vscode-extension--release_created'] }}
      vscode_tag: ${{ steps.release.outputs['packages/vscode-extension--tag_name'] }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
