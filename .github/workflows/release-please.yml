name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      cli_released: ${{ steps.release.outputs['packages/cli--release_created'] }}
      cli_tag: ${{ steps.release.outputs['packages/cli--tag_name'] }}
      vscode_released: ${{ steps.release.outputs['packages/vscode-extension--release_created'] }}
      vscode_tag: ${{ steps.release.outputs['packages/vscode-extension--tag_name'] }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a vscode-v* release is cut, package the VSIX, attach it to the release,
  # and publish to Open VSX. Chained in-workflow (not a separate `on: release`
  # workflow) because release-please creates the release with GITHUB_TOKEN, which
  # does not trigger cascading workflow events.
  publish-vscode:
    name: Publish VSCode extension
    needs: release-please
    if: needs.release-please.outputs.vscode_released == 'true'
    uses: ./.github/workflows/publish-vscode.yml
    with:
      tag: ${{ needs.release-please.outputs.vscode_tag }}
    secrets: inherit
